html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; color: #0F1E2A; background: #F6F8FA; }
body { display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #FFFFFF; border-bottom: 1px solid #DFE7EE; flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 650; }
.group { display: flex; align-items: center; gap: 4px; padding-right: 8px; margin-right: 4px; border-right: 1px solid #DFE7EE; }
.group:last-of-type { border-right: none; }
.label { font-size: 12px; color: #55667A; margin-right: 2px; }
button, select { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid #C9D5DF; background: #FFFFFF; border-radius: 8px; cursor: pointer; color: #0F1E2A; }
button:hover { background: #EAF2F7; }
button.primary { background: #0E4A6B; color: #FFFFFF; border-color: #0E4A6B; }
button.primary:hover { background: #0B3B56; }
#spacer { flex: 1; }
#status { font-size: 12px; color: #55667A; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header { flex-wrap: nowrap; }
header h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
#graph { flex: 1; position: relative; overflow: auto; background: #FFFFFF; background-image: radial-gradient(#DFE7EE 1px, transparent 1px); background-size: 10px 10px; }
.cls { font-family: "Segoe UI", sans-serif; font-size: 12px; width: 100%; }
.cls .st { text-align: center; font-size: 11px; color: #55667A; padding-top: 4px; }
.cls .nm { text-align: center; font-weight: 700; padding: 4px 6px 5px; border-bottom: 1px solid #0E4A6B; }
.cls .cmp { padding: 3px 6px; min-height: 8px; border-bottom: 1px solid #0E4A6B; }
.cls .cmp:last-child { border-bottom: none; }
.cls .row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main { flex: 1; display: flex; min-height: 0; }
#graph { min-width: 0; }
#props { width: 330px; flex: none; overflow: auto; background: #FFFFFF; border-left: 1px solid #DFE7EE; padding: 12px 14px 20px; box-sizing: border-box; font-size: 13px; }
#props h2 { font-size: 15px; margin: 0 0 4px; }
#props .kind { margin: 0 0 10px; color: #55667A; font-size: 12px; }
#props .hint, #props .legend { color: #55667A; font-size: 12px; margin: 6px 0; line-height: 1.4; }
#props .tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; margin-bottom: 10px; border-bottom: 1px solid #DFE7EE; }
#props .tabs button { white-space: nowrap; border: none; border-radius: 6px 6px 0 0; padding: 6px 10px; background: transparent; color: #55667A; }
#props .tabs button.on { color: #0E4A6B; font-weight: 650; box-shadow: inset 0 -2px 0 #0E4A6B; }
#props .f { display: flex; flex-direction: column; gap: 3px; margin-bottom: 9px; }
#props .fl { font-size: 12px; color: #3B4B59; display: flex; align-items: center; gap: 6px; }
#props input[type=text], #props textarea, #props select { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 5px 7px; border: 1px solid #C9D5DF; border-radius: 6px; background: #FFFFFF; }
#props textarea { resize: vertical; }
#props input[type=checkbox] { align-self: flex-start; width: 16px; height: 16px; margin: 2px 0; }
#props .ro .rv { color: #55667A; font-size: 12px; word-break: break-all; }
#props .scope { font-size: 10px; padding: 0 6px; border-radius: 8px; line-height: 16px; }
#props .scope.model { background: #E6F0F6; color: #0E4A6B; }
#props .scope.diagram { background: #FFF1D6; color: #8A5A00; }
#props .tag { display: grid; grid-template-columns: 110px 1fr 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
#props .tag .tn { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#props .tag.removed .tn { text-decoration: line-through; color: #B3261E; }
#props .tag.add { grid-template-columns: 1fr 1fr auto; margin-top: 12px; }
#props .tag .x { padding: 2px 0; }
#props h3 { font-size: 13px; margin: 14px 0 6px; }
#props .member { display: grid; grid-template-columns: 46px 1fr 1fr 28px; gap: 5px; margin-bottom: 5px; align-items: center; }
#props .member.params { grid-template-columns: 70px 1fr; margin: -2px 0 8px 51px; }
#props .member select { padding: 5px 2px; text-align: center; }
#props .addm { margin-top: 4px; font-size: 12px; padding: 4px 10px; }
#props .color { display: flex; gap: 8px; align-items: center; }
#props .color input { width: 44px; height: 28px; padding: 0; border: 1px solid #C9D5DF; border-radius: 6px; }
#delete { position: fixed; inset: 0; background: rgba(15, 30, 42, .35); display: grid; place-items: center; z-index: 10; }
#delete[hidden] { display: none; }
.d-box { background: #FFFFFF; border-radius: 14px; padding: 20px 22px; width: min(520px, 92vw); box-shadow: 0 24px 60px rgba(8, 44, 65, .25); display: flex; flex-direction: column; gap: 10px; }
.d-title { margin: 0; font-size: 17px; }
.d-names { margin: 0; color: #55667A; font-size: 13px; }
.d-box button[data-d] { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 3px; padding: 10px 12px; }
.d-box button span { font-size: 12px; color: #55667A; }
.d-box button.danger { border-color: #E3A7A2; }
.d-box button.danger b { color: #B3261E; }
.d-box button.d-cancel { align-self: flex-end; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="group"><span class="label" id="l-add"></span><span id="toolbox"></span></div>
  <div class="group"><span class="label" id="l-conn"></span><select id="conntype"></select></div>
  <div class="group">
    <button data-action="align-left" id="b-al">⇤</button>
    <button data-action="align-center" id="b-ac">↔</button>
    <button data-action="align-top" id="b-at">⤒</button>
    <button data-action="align-middle" id="b-am">↕</button>
    <button data-action="same-size" id="b-ss">▣</button>
  </div>
  <div class="group">
    <button data-action="zoom-out">−</button>
    <button data-action="zoom-fit" id="b-fit">⤢</button>
    <button data-action="zoom-in">+</button>
  </div>
  <span id="spacer"></span>
  <span id="status"></span>
  <button id="cancel"></button>
  <button id="save" class="primary"></button>
</header>
<main><div id="graph"></div><aside id="props"></aside></main>
<div id="delete" hidden>
  <div class="d-box">
    <h2 class="d-title"></h2>
    <p class="d-names"></p>
    <button data-d="diagram"><b></b><span></span></button>
    <button data-d="model" class="danger"><b></b><span></span></button>
    <button data-d="cancel" class="d-cancel"></button>
  </div>
</div>
<script>/*DIAGRAM*/</script>
<script>
(function () {
  var t = window.__DIAGRAM__.texts;
  var set = function (id, text) { document.getElementById(id).textContent = text; };
  set('l-add', t.add); set('l-conn', t.connector); set('save', t.save); set('cancel', t.cancel); set('status', t.hint);
  document.querySelector('#delete .d-title').textContent = t.delete_title;
  document.querySelector('#delete .d-cancel').textContent = t.cancel_delete;
  var tips = { 'b-al': t.align_left, 'b-ac': t.align_center, 'b-at': t.align_top, 'b-am': t.align_middle, 'b-ss': t.same_size, 'b-fit': t.fit };
  for (var id in tips) document.getElementById(id).title = tips[id];
})();
</script>
<script>/*EDITOR_JS*/</script>
</body>
</html>
