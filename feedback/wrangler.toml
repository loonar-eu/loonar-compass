# Loonar Compass feedback service. Deploy: npx wrangler deploy (from this folder); the token: npx wrangler secret put GITHUB_TOKEN
name = "compass-feedback"
main = "worker.js"
compatibility_date = "2026-09-01"

# The address the application uses (https://feedback.loonar.eu). Needs the loonar.eu zone in Cloudflare; without it,
# remove these lines and use the workers.dev address (set LOONAR_FEEDBACK_URL for tests).
routes = [{ pattern = "feedback.loonar.eu", custom_domain = true }]

[vars]
ISSUES_REPO = "loonar-eu/loonar-compass"
STATS_REPO = "loonar-eu/compass-stats"
PRIVATE_REPO = "loonar-eu/compass-private"

# Requests per address: 30 summaries and 3 reports a minute.
[[ratelimits]]
name = "STATS_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
