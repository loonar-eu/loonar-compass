name: Bug
description: Something in Loonar Compass does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not paste confidential model content, names of clients or screenshots of company models here – use "Report a bug" in the application (screenshots go to the maintainer privately) or e-mail.
  - type: input
    id: install
    attributes:
      label: Installation id
      description: In the application, About or Usage statistics → "Installation id" → Copy. It is random and says nothing about you.
      placeholder: 7f3c2b1a-1234-4abc-8def-0123456789ab
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.9.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Compass in a tab of EA, Standalone window, Compass Hub, Check mode (CI), Installer]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
