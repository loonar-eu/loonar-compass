# Adds to Jira (project LC) what GitHub for Jira does not send: the test results of a push (passed / failed counts
# on the build of every issue named in its commits, "LC-123 …") and a published release as a deployment to
# production of those issues. Commits, branches and pull requests come from the GitHub for Jira app.
# Repository settings: secrets JIRA_CLIENT_ID and JIRA_CLIENT_SECRET (Jira OAuth credentials "Loonar Compass"),
# variable JIRA_CLOUD_ID.
name: Jira

on:
  push:
    branches: ["**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# The Jira credentials are given only to the steps that talk to Jira, not to "cargo test" (a build script of a
# dependency could read them there) (LC-361).
jobs:
  tests:
    if: github.event_name != 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run tests
        id: tests
        shell: bash
        run: cargo test --release 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Send test results to Jira
        if: always()
        shell: bash
        env:
          JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}
          JIRA_CLIENT_SECRET: ${{ secrets.JIRA_CLIENT_SECRET }}
          JIRA_CLOUD_ID: ${{ vars.JIRA_CLOUD_ID }}
        run: python .github/jira/jira_sync.py build ${{ steps.tests.outcome == 'success' && 'successful' || 'failed' }} test.log

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Send the release to Jira
        env:
          JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}
          JIRA_CLIENT_SECRET: ${{ secrets.JIRA_CLIENT_SECRET }}
          JIRA_CLOUD_ID: ${{ vars.JIRA_CLOUD_ID }}
        run: python3 .github/jira/jira_sync.py release
