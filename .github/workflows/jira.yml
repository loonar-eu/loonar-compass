# Shows development work in Jira (project LC): commits with a key in the message ("LC-123 …") appear in the
# Development panel of the issue, the tests of the push as a build with results, and a published release as a
# deployment to production of every issue named in its commits.
# Repository settings: secrets JIRA_CLIENT_ID and JIRA_CLIENT_SECRET (Jira OAuth credentials "Loonar Compass"),
# variable JIRA_CLOUD_ID.
name: Jira

on:
  push:
    branches: ["**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}
  JIRA_CLIENT_SECRET: ${{ secrets.JIRA_CLIENT_SECRET }}
  JIRA_CLOUD_ID: ${{ vars.JIRA_CLOUD_ID }}

jobs:
  commits:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Send commits to Jira
        run: python3 .github/jira/jira_sync.py commits

  tests:
    if: github.event_name != 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run tests
        id: tests
        shell: bash
        run: cargo test --release 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Send test results to Jira
        if: always()
        shell: bash
        run: python .github/jira/jira_sync.py build ${{ steps.tests.outcome == 'success' && 'successful' || 'failed' }} test.log

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Send the release to Jira
        run: python3 .github/jira/jira_sync.py release
