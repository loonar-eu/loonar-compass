[package]
name = "loonar-compass"
version = "0.9.2"
edition = "2021"
description = "AI assistant for Sparx Enterprise Architect: chat with an EA model stored in PostgreSQL (Claude API)"
publish = false

[dependencies]
eframe = { version = "0.29", features = ["wgpu"] }
# DirectX 12 (including the WARP software renderer): fallback window rendering when the system has no OpenGL 2.0 (e.g. Windows Server).
wgpu = { version = "22", default-features = false, features = ["dx12"] }
egui = "0.29"
# system-proxy: the proxy from the Windows Internet settings (corporate networks); HTTPS_PROXY also works.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "rustls-tls-native-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
base64 = "0.22"
postgres = "0.19"
# SQL Server, MySQL and Oracle repositories through their ODBC drivers.
odbc-api = "8"
# TLS for the model database (Windows SChannel: the Windows certificate store, including company CAs).
native-tls = "0.2"
postgres-native-tls = "0.5"
# EA file models (.qea/.qeax are SQLite databases), read-only; SQLite is compiled in (no DLL next to the program).
raw-window-handle = "0.6"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
# Diagram editor window: WebView2 (the Edge engine built into Windows) with the bundled maxGraph editor.
wry = "0.57"
tao = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
arboard = "3"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Text of PDF documents read by the assistant.
pdf-extract = "0.9"
# The read-only GraphQL API of the team hub.
juniper = { version = "0.16", default-features = false, features = ["schema-language"] }
# Images drawn by the assistant (SVG -> PNG), Word documents (DOCX) and Excel workbooks (XLSX).
resvg = "0.45"
docx-rs = "0.4"
rust_xlsxwriter = "0.80"
sha2 = "0.10"
ring = "0.17"
p12-keystore = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
panic = "abort"
