[package]
name = "loonar-compass-setup"
version = "0.7.3"
edition = "2021"
description = "Loonar Compass setup wizard"
publish = false

[dependencies]
eframe = { version = "0.29", features = ["wgpu"] }
# DirectX 12 (including the WARP software renderer): fallback window rendering when the system has no OpenGL 2.0 (e.g. Windows Server).
wgpu = { version = "22", default-features = false, features = ["dx12"] }
egui = "0.29"
anyhow = "1"
keyring = { version = "3", features = ["windows-native"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
# Win32 API instead of helper programs: registry, known folders, elevation (UAC), DLL search order, screen size.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
debug = false
panic = "abort"
